name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so the badge means "still green today" rather than "was green on
    # the last push". Offset off the hour — GitHub delays on-the-hour crons.
    - cron: "35 6 * * *"

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node, which needs pnpm on PATH to resolve its cache.
      # The version comes from packageManager in package.json, so it lives in
      # one place.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      # Node major is pinned — an unpinned toolchain rots CI with no commit to
      # blame.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Separate steps so a red run names which gate failed.
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # Doubles as the typecheck gate: build is `astro check && astro build`,
      # so a separate typecheck step would only repeat it.
      - name: Build
        run: pnpm run build
