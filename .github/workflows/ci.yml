name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "35 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck is covered by build, which runs `tsc -b && vite build` over src,
  # tests included.
  verify:
    uses: mark-mcdermott/mm-claude-starter/.github/workflows/node-verify.yml@main
    with:
      package-manager: npm
      node-version: "24"
      lint-script: lint
      typecheck-script: ""
      test-script: test
